<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XSafeClaw · Sentinel Atlas</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap");

      :root {
        --void: #05070d;
        --deck: rgba(8, 14, 23, 0.82);
        --deck-solid: rgba(10, 18, 30, 0.96);
        --panel-edge: rgba(94, 242, 227, 0.22);
        --signal: #41f2e6;
        --signal-soft: rgba(65, 242, 230, 0.16);
        --plasma: #d96dff;
        --amber: #ffb357;
        --coral: #ff6b6b;
        --lime: #9cff73;
        --text: #bff6ee;
        --cream: #f3d88b;
        --bubble: #f0a8ff;
        --muted: #8ec7cf;
        --dim: #6295a0;
        --comic: "ZCOOL KuaiLe", "Comic Sans MS", "Comic Neue", "Segoe Print", "PingFang SC", "Microsoft YaHei", cursive, sans-serif;
        --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--void);
        color: var(--text);
        font-family: var(--comic);
      }

      body {
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          linear-gradient(115deg, rgba(65, 242, 230, 0.08), transparent 24%),
          linear-gradient(245deg, rgba(217, 109, 255, 0.1), transparent 30%),
          linear-gradient(180deg, #071017 0%, #05070d 58%, #04060a 100%);
        pointer-events: none;
      }

      .sentinel-grid {
        position: fixed;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
      }

      .sentinel-grid::before,
      .sentinel-grid::after {
        content: "";
        position: absolute;
        inset: -20%;
      }

      .sentinel-grid::before {
        background:
          linear-gradient(rgba(65, 242, 230, 0.075) 1px, transparent 1px),
          linear-gradient(90deg, rgba(65, 242, 230, 0.075) 1px, transparent 1px);
        background-size: 80px 80px;
        transform: perspective(720px) rotateX(58deg) translateY(6%);
        transform-origin: center bottom;
        animation: grid-drift 15s linear infinite;
        opacity: 0.48;
      }

      .sentinel-grid::after {
        background:
          repeating-linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.025) 0,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px,
            transparent 7px
          );
        opacity: 0.42;
        mix-blend-mode: screen;
      }

      .aurora-scan {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          conic-gradient(
            from 180deg at 58% 42%,
            transparent 0deg,
            rgba(65, 242, 230, 0.11) 48deg,
            transparent 86deg,
            rgba(217, 109, 255, 0.09) 178deg,
            transparent 250deg,
            rgba(255, 179, 87, 0.07) 300deg,
            transparent 360deg
          ),
          linear-gradient(90deg, transparent, rgba(65, 242, 230, 0.05), transparent);
        animation: aurora-flow 18s ease-in-out infinite alternate;
        opacity: 0.72;
      }

      .route-trails {
        position: fixed;
        inset: 0;
        z-index: 4;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .route-trails path {
        fill: none;
        stroke: url(#trailGradient);
        stroke-width: 1.2;
        stroke-dasharray: 8 18;
        opacity: 0.42;
        animation: trail-shift 10s linear infinite;
      }

      .route-trails path:nth-of-type(2) {
        animation-duration: 13s;
        opacity: 0.32;
      }

      .route-trails path:nth-of-type(3) {
        animation-duration: 16s;
        opacity: 0.28;
      }

      #map {
        position: absolute;
        inset: 0;
        z-index: 3;
      }

      .orbit-shell {
        position: fixed;
        left: 50%;
        top: 50%;
        z-index: 5;
        width: 48vw;
        max-width: 760px;
        min-width: 420px;
        aspect-ratio: 1;
        border: 1px solid rgba(65, 242, 230, 0.12);
        border-radius: 50%;
        transform: translate(-50%, -50%) rotate(-10deg);
        pointer-events: none;
      }

      .orbit-shell::before,
      .orbit-shell::after {
        content: "";
        position: absolute;
        inset: 9%;
        border: 1px dashed rgba(217, 109, 255, 0.18);
        border-radius: 50%;
      }

      .orbit-shell::after {
        inset: 21%;
        border-style: solid;
        border-color: rgba(255, 179, 87, 0.12);
        animation: orbit-pulse 3.8s ease-in-out infinite;
      }

      .stage {
        position: relative;
        z-index: 6;
        display: block;
        width: 100%;
        height: 100vh;
        padding: 22px;
        pointer-events: none;
      }

      .mission,
      .constellation-console,
      .view-dock,
      .foot {
        pointer-events: auto;
      }

      .mission {
        position: absolute;
        left: 22px;
        top: 22px;
        right: 430px;
        display: grid;
        grid-template-columns: minmax(260px, 0.92fr) minmax(320px, 1fr) minmax(220px, 0.66fr);
        gap: 10px;
        align-items: stretch;
      }

      .mission-head {
        min-width: 0;
        padding: 14px 16px 13px;
        border: 1px solid var(--panel-edge);
        background: linear-gradient(135deg, rgba(8, 18, 29, 0.78), rgba(10, 11, 20, 0.56));
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
        clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%);
        backdrop-filter: blur(16px);
      }

      .kicker {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 13px;
        color: var(--signal);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .kicker::before {
        content: "";
        width: 28px;
        height: 2px;
        background: linear-gradient(90deg, var(--signal), transparent);
      }

      h1 {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 0;
        color: var(--cream);
        font-family: var(--comic);
        font-size: 31px;
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: 0;
        text-shadow: 0 0 14px rgba(255, 179, 87, 0.18);
      }

      .security-mark {
        width: 35px;
        height: 35px;
        flex: 0 0 auto;
        background: linear-gradient(135deg, var(--signal), var(--plasma) 56%, var(--amber));
        filter: drop-shadow(0 0 12px rgba(65, 242, 230, 0.52));
        mask: url("shield-check.svg") center / contain no-repeat;
      }

      .title-accent {
        color: var(--amber);
        text-shadow: 0 0 16px rgba(255, 179, 87, 0.36);
      }

      .subtitle {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.58;
        overflow-wrap: anywhere;
      }

      .status-line {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .status-line span {
        min-width: 0;
        padding: 7px 8px;
        border: 1px solid rgba(65, 242, 230, 0.16);
        background: rgba(65, 242, 230, 0.055);
        color: var(--muted);
        font-size: 10.5px;
        text-align: center;
      }

      .status-line b {
        display: block;
        margin-bottom: 2px;
        color: var(--signal);
        font-size: 12px;
        font-weight: 800;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .chip {
        min-height: 118px;
        padding: 16px 14px;
        border: 1px solid rgba(143, 162, 183, 0.18);
        background:
          linear-gradient(135deg, rgba(65, 242, 230, 0.105), transparent 52%),
          rgba(7, 13, 22, 0.64);
        backdrop-filter: blur(12px);
      }

      .chip b {
        display: block;
        color: var(--cream);
        font-family: var(--comic);
        font-size: 26px;
        font-weight: 800;
        line-height: 1.1;
      }

      .chip span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .chip i {
        display: block;
        min-height: 14px;
        margin-top: 5px;
        color: var(--lime);
        font-size: 10.5px;
        font-style: normal;
      }

      .threat-radar {
        display: grid;
        grid-template-columns: 86px 1fr;
        gap: 12px;
        align-items: center;
        min-height: 118px;
        padding: 13px;
        border: 1px solid rgba(217, 109, 255, 0.2);
        background: rgba(8, 14, 23, 0.62);
        backdrop-filter: blur(14px);
      }

      .radar-face {
        position: relative;
        width: 82px;
        aspect-ratio: 1;
        border: 1px solid rgba(65, 242, 230, 0.32);
        border-radius: 50%;
        background:
          linear-gradient(90deg, transparent 49%, rgba(65, 242, 230, 0.18) 50%, transparent 51%),
          linear-gradient(transparent 49%, rgba(65, 242, 230, 0.18) 50%, transparent 51%),
          repeating-radial-gradient(circle, rgba(65, 242, 230, 0.18) 0 1px, transparent 1px 18px);
        overflow: hidden;
      }

      .radar-face::before {
        content: "";
        position: absolute;
        inset: 0;
        background: conic-gradient(from 0deg, rgba(65, 242, 230, 0.45), transparent 68deg);
        animation: sweep 4.8s linear infinite;
      }

      .radar-face::after {
        content: "";
        position: absolute;
        left: 54%;
        top: 32%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow:
          -28px 24px 0 var(--signal),
          22px 30px 0 var(--plasma);
      }

      .radar-copy {
        min-width: 0;
      }

      .radar-copy strong {
        display: block;
        color: var(--cream);
        font-size: 13px;
        letter-spacing: 0.08em;
      }

      .radar-copy p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.52;
      }

      .center-space {
        position: relative;
        min-width: 0;
      }

      .view-dock {
        position: absolute;
        left: 50%;
        bottom: 28px;
        z-index: 7;
        display: flex;
        gap: 8px;
        padding: 6px;
        border: 1px solid rgba(65, 242, 230, 0.18);
        background: rgba(5, 9, 16, 0.72);
        transform: translateX(-50%);
        backdrop-filter: blur(14px);
      }

      .view-dock button,
      .tabs button,
      .back {
        font-family: var(--comic);
        cursor: pointer;
      }

      .view-dock button {
        min-width: 86px;
        padding: 10px 14px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .view-dock button.active {
        background: linear-gradient(135deg, rgba(65, 242, 230, 0.18), rgba(217, 109, 255, 0.1));
        color: var(--cream);
        box-shadow: inset 0 0 0 1px rgba(65, 242, 230, 0.2);
      }

      .constellation-console {
        position: absolute;
        top: 22px;
        right: 22px;
        width: min(390px, calc(100vw - 44px));
        height: calc(100vh - 118px);
        min-height: 520px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--panel-edge);
        background:
          linear-gradient(180deg, rgba(8, 17, 29, 0.94), rgba(6, 9, 17, 0.86)),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 28px);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(18px);
      }

      .console-head {
        padding: 15px 16px 11px;
        border-bottom: 1px solid rgba(143, 162, 183, 0.16);
      }

      .console-head small {
        color: var(--signal);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .console-head h2 {
        margin: 6px 0 0;
        color: var(--cream);
        font-family: var(--comic);
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        padding: 0 12px 12px;
        background: transparent;
      }

      .tabs button {
        padding: 10px 4px;
        border: 1px solid rgba(143, 162, 183, 0.14);
        background: rgba(255, 255, 255, 0.035);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .tabs button.active {
        border-color: rgba(65, 242, 230, 0.44);
        background: rgba(65, 242, 230, 0.12);
        color: var(--signal);
      }

      .list,
      .detail {
        flex: 1;
        overflow-y: auto;
      }

      .list::-webkit-scrollbar,
      .detail::-webkit-scrollbar {
        width: 6px;
      }

      .list::-webkit-scrollbar-thumb,
      .detail::-webkit-scrollbar-thumb {
        background: rgba(65, 242, 230, 0.24);
      }

      .row {
        position: relative;
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) 36px;
        gap: 10px;
        align-items: center;
        padding: 10px 16px;
        cursor: pointer;
      }

      .row::before {
        content: "";
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: transparent;
      }

      .row:hover {
        background: rgba(65, 242, 230, 0.07);
      }

      .row:hover::before {
        background: var(--signal);
      }

      .rank {
        color: var(--dim);
        font-size: 11px;
        font-weight: 800;
        text-align: right;
      }

      .name {
        min-width: 0;
      }

      .name .primary,
      .name .secondary {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .name .primary {
        color: var(--cream);
        font-size: 13px;
        font-weight: 700;
      }

      .name .secondary {
        margin-top: 2px;
        color: var(--muted);
        font-size: 10.5px;
      }

      .bar {
        height: 5px;
        margin-top: 7px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--signal), var(--plasma), var(--amber));
        box-shadow: 0 0 12px rgba(65, 242, 230, 0.18);
      }

      .count {
        color: var(--amber);
        font-size: 13px;
        font-weight: 800;
        text-align: right;
      }

      .detail {
        display: none;
        padding: 18px;
      }

      .detail.show {
        display: block;
      }

      .back {
        margin-bottom: 14px;
        padding: 8px 12px;
        border: 1px solid rgba(65, 242, 230, 0.24);
        background: rgba(65, 242, 230, 0.08);
        color: var(--signal);
        font-size: 11px;
        font-weight: 800;
      }

      .detail h2 {
        margin: 0;
        color: var(--cream);
        font-size: 22px;
        font-weight: 800;
      }

      .detail .meta {
        margin: 6px 0 18px;
        color: var(--muted);
        font-size: 12px;
      }

      .detail h3 {
        margin: 18px 0 10px;
        color: var(--signal);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .org {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 0;
        border-bottom: 1px solid rgba(143, 162, 183, 0.12);
        font-size: 12px;
      }

      .org em {
        min-width: 0;
        overflow: hidden;
        color: var(--cream);
        font-style: normal;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .org b {
        flex: 0 0 auto;
        color: var(--amber);
      }

      .empty {
        padding: 8px 0;
        color: var(--muted);
        font-size: 12px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 10px 14px 14px;
        color: var(--muted);
        font-size: 10.5px;
      }

      .legend .dot {
        display: inline-block;
        margin-right: 6px;
        border-radius: 50%;
        background: radial-gradient(circle, #f7e7ad 0 10%, var(--signal) 35%, rgba(65, 242, 230, 0.2) 75%);
        vertical-align: middle;
        box-shadow: 0 0 16px rgba(65, 242, 230, 0.35);
      }

      .foot {
        position: fixed;
        left: 22px;
        right: 22px;
        bottom: 16px;
        z-index: 8;
        color: var(--dim);
        font-size: 11px;
        line-height: 1.5;
        pointer-events: auto;
        overflow-wrap: anywhere;
      }

      .foot a {
        color: var(--signal);
        text-decoration: none;
      }

      .error {
        position: absolute;
        left: 50%;
        top: 50%;
        color: var(--coral);
        transform: translate(-50%, -50%);
      }

      @keyframes grid-drift {
        from {
          background-position: 0 0, 0 0;
        }
        to {
          background-position: 0 80px, 80px 0;
        }
      }

      @keyframes aurora-flow {
        from {
          transform: translateX(-1.5%) translateY(0);
          filter: hue-rotate(0deg);
        }
        to {
          transform: translateX(1.5%) translateY(-1%);
          filter: hue-rotate(16deg);
        }
      }

      @keyframes trail-shift {
        to {
          stroke-dashoffset: -210;
        }
      }

      @keyframes orbit-pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.98);
        }
        50% {
          opacity: 0.75;
          transform: scale(1.02);
        }
      }

      @keyframes sweep {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 1180px) {
        body {
          overflow: auto;
          overflow-x: hidden;
        }

        #map {
          height: 72vh;
          min-height: 520px;
        }

        .stage {
          display: block;
          height: auto;
          min-height: 100vh;
          padding: 18px;
        }

        .mission,
        .constellation-console {
          position: relative;
          inset: auto;
          max-width: none;
          width: 100%;
        }

        .mission {
          display: flex;
          flex-direction: column;
          margin-bottom: 18px;
        }

        .constellation-console {
          height: 560px;
          min-height: 0;
          margin-top: calc(72vh + 22px);
        }

        .orbit-shell,
        .route-trails {
          display: none;
        }

        .view-dock,
        .foot {
          position: relative;
          left: auto;
          right: auto;
          bottom: auto;
          transform: none;
        }

        .view-dock {
          width: max-content;
          margin: 12px auto 0;
        }

        .foot {
          margin: 16px 0 0;
        }
      }

      @media (max-width: 640px) {
        h1 {
          font-size: 28px;
        }

        .security-mark {
          width: 30px;
          height: 30px;
        }

        .stats,
        .status-line,
        .threat-radar {
          grid-template-columns: 1fr;
        }

        .radar-face {
          width: 96px;
          margin: 0 auto;
        }

        .row {
          grid-template-columns: 26px minmax(0, 1fr) 34px;
          padding: 10px 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="sentinel-grid" aria-hidden="true"></div>
    <div class="aurora-scan" aria-hidden="true"></div>
    <svg class="route-trails" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="trailGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#41f2e6" stop-opacity="0" />
          <stop offset="45%" stop-color="#41f2e6" stop-opacity="0.72" />
          <stop offset="78%" stop-color="#d96dff" stop-opacity="0.64" />
          <stop offset="100%" stop-color="#ffb357" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path d="M155 565 C 420 430, 610 390, 810 422 S 1185 520, 1445 340" />
      <path d="M205 315 C 430 230, 690 250, 850 330 S 1120 482, 1390 455" />
      <path d="M330 720 C 540 585, 716 570, 940 610 S 1210 635, 1510 520" />
    </svg>
    <div class="orbit-shell" aria-hidden="true"></div>
    <div id="map" aria-label="XSafeClaw stargazer world map"></div>

    <main class="stage">
      <section class="mission" aria-label="XSafeClaw atlas overview">
        <div class="mission-head">
          <div class="kicker">XSafeClaw Sentinel Atlas</div>
          <h1>
            <span>智能体安全</span>
            <span class="security-mark" aria-hidden="true"></span>
            <span class="title-accent">星图</span>
          </h1>
          <p class="subtitle">追踪 XSafeClaw Star 用户的城市、院校与组织分布，呈现安全智能体社区的全球坐标。</p>
          <div class="status-line" aria-label="Atlas status">
            <span><b>LIVE</b>GitHub API</span>
            <span><b>AGG</b>聚合统计</span>
            <span><b>MAP</b>地理解析</span>
          </div>
        </div>

        <section class="stats" id="stats" aria-label="Atlas statistics"></section>

        <section class="threat-radar" aria-label="Coverage radar">
          <div class="radar-face" aria-hidden="true"></div>
          <div class="radar-copy">
            <strong>COMMUNITY SIGNAL</strong>
            <p>每个脉冲代表公开资料中可定位的 Star 聚合节点，颜色和尺寸由城市活跃度驱动。</p>
          </div>
        </section>
      </section>

      <section class="center-space" aria-hidden="true"></section>

      <aside class="constellation-console" aria-label="Atlas rankings">
        <div class="console-head">
          <small>constellation console</small>
          <h2>节点排行与机构分布</h2>
        </div>
        <div class="tabs" id="tabs">
          <button type="button" data-tab="city" class="active">城市</button>
          <button type="button" data-tab="school">高校</button>
          <button type="button" data-tab="company">企业</button>
        </div>
        <div class="list" id="list"></div>
        <div class="detail" id="detail"></div>
        <div class="legend">
          <span><span class="dot" style="width: 7px; height: 7px"></span>1 人</span>
          <span><span class="dot" style="width: 13px; height: 13px"></span>5 人</span>
          <span><span class="dot" style="width: 19px; height: 19px"></span>15+ 人</span>
        </div>
      </aside>
    </main>

    <nav class="view-dock" aria-label="Map view">
      <button type="button" id="worldView" class="active">全球</button>
      <button type="button" id="chinaView">中国</button>
    </nav>

    <footer class="foot" id="foot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js"></script>
    <script src="data.js"></script>
    <script>
      const atlas = window.ATLAS;
      const stats = document.getElementById("stats");
      const list = document.getElementById("list");
      const detail = document.getElementById("detail");
      const tabs = document.getElementById("tabs");
      const foot = document.getElementById("foot");
      const worldView = document.getElementById("worldView");
      const chinaView = document.getElementById("chinaView");
      const mapEl = document.getElementById("map");
      let tab = "city";
      let chart;

      function formatNumber(value) {
        return Number(value || 0).toLocaleString();
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function renderStats() {
        const cards = [
          [atlas.totalStars, "总 STAR 数", "★"],
          [atlas.located, "可定位用户", `${atlas.countryCount} 个国家与地区`],
          [atlas.schoolCount, "高校与科研机构", "school graph"],
          [atlas.companyCount, "企业与组织", "org graph"],
        ];
        stats.innerHTML = cards
          .map(
            ([value, label, note]) =>
              `<div class="chip"><b>${formatNumber(value)}</b><span>${label}</span><i>${note}</i></div>`,
          )
          .join("");
      }

      function renderFooter() {
        foot.innerHTML =
          `数据来源：GitHub Stargazers API（<a href="https://github.com/${atlas.repo}">${atlas.repo}</a>）` +
          `&nbsp;·&nbsp;生成于 ${atlas.generated}` +
          `&nbsp;·&nbsp;台湾是中华人民共和国领土，地图已按中国版图绘制，如有错漏之处请issue指出`;
      }

      function cityData() {
        return atlas.cities.map((city) => ({
          name: city.zh,
          value: [city.lng, city.lat, city.count],
          raw: city,
        }));
      }

      function pointSize(count) {
        const max = Math.max(1, atlas.cities[0]?.count || 1);
        return 6 + Math.sqrt(count / max) * 30;
      }

      function tooltip(city) {
        const orgLine = (items, label) =>
          items.length
            ? `<div style="margin-top:8px;font-size:10px;letter-spacing:.14em;color:#41f2e6">${label}</div>` +
              items
                .slice(0, 4)
                .map(
                  ([name, count]) =>
                    `<div style="font-size:11.5px;color:#bff6ee">${escapeHtml(name)} <span style="color:#ffb357">· ${count}</span></div>`,
                )
                .join("")
            : "";
        return (
          `<div style="font-size:16px;font-weight:800;color:#f3d88b">${escapeHtml(city.zh)}</div>` +
          `<div style="font-size:12px;color:#41f2e6;margin-top:3px">★ ${city.count} 位 Star 用户</div>` +
          orgLine(city.schools, "高校") +
          orgLine(city.companies, "企业") +
          `<div style="margin-top:8px;font-size:10.5px;color:#8fa2b7">点击查看机构统计</div>`
        );
      }

      function renderMap() {
        if (!window.echarts || !atlas) {
          mapEl.innerHTML = '<p class="error">星图资源加载失败。</p>';
          return;
        }

        chart = echarts.init(mapEl, null, { renderer: "canvas" });
        const values = cityData();
        const countryMax = Math.max(1, ...Object.values(atlas.countries || {}));
        const regions = Object.entries(atlas.countries || {}).map(([name, count]) => ({
          name,
          itemStyle: {
            areaColor:
              count === countryMax
                ? "#163f45"
                : `rgba(24,80,91,${0.16 + 0.44 * Math.sqrt(count / countryMax)})`,
          },
        }));

        chart.setOption({
          backgroundColor: "transparent",
          tooltip: {
            trigger: "item",
            backgroundColor: "rgba(5,9,16,.95)",
            borderColor: "rgba(65,242,230,.38)",
            borderWidth: 1,
            padding: [11, 14],
            extraCssText: "box-shadow:0 16px 42px rgba(0,0,0,.38);max-width:280px",
            formatter: (params) => (params.data?.raw ? tooltip(params.data.raw) : null),
          },
          geo: {
            map: "world",
            roam: true,
            center: [38, 18],
            zoom: 1.04,
            zoomLimit: { min: 0.9, max: 14 },
            itemStyle: {
              areaColor: "#0b1722",
              borderColor: "rgba(65,242,230,.21)",
              borderWidth: 0.6,
            },
            emphasis: {
              itemStyle: {
                areaColor: "#132d36",
                borderColor: "rgba(255,179,87,.55)",
              },
              label: { show: false },
            },
            label: { show: false },
            regions,
          },
          series: [
            {
              name: "signal-field",
              type: "scatter",
              coordinateSystem: "geo",
              data: values,
              symbolSize: (value) => pointSize(value[2]),
              itemStyle: {
                color: {
                  type: "radial",
                  x: 0.4,
                  y: 0.34,
                  r: 1,
                  colorStops: [
                    { offset: 0, color: "rgba(255,255,255,.98)" },
                    { offset: 0.22, color: "rgba(65,242,230,.95)" },
                    { offset: 0.62, color: "rgba(217,109,255,.62)" },
                    { offset: 1, color: "rgba(65,242,230,.08)" },
                  ],
                },
                shadowBlur: 18,
                shadowColor: "rgba(65,242,230,.58)",
              },
              emphasis: {
                scale: 1.35,
                itemStyle: {
                  shadowBlur: 34,
                  shadowColor: "rgba(255,179,87,.7)",
                },
              },
              zlevel: 3,
            },
            {
              name: "signal-pulse",
              type: "effectScatter",
              coordinateSystem: "geo",
              data: values.filter((item) => item.raw.count >= Math.max(2, Math.ceil((atlas.cities[0]?.count || 1) * 0.18))),
              symbolSize: (value) => Math.min(42, pointSize(value[2]) * 0.82),
              rippleEffect: {
                brushType: "stroke",
                scale: 3.4,
                period: 5,
              },
              itemStyle: {
                color: "rgba(255,179,87,.88)",
                shadowBlur: 22,
                shadowColor: "rgba(255,179,87,.54)",
              },
              zlevel: 4,
            },
          ],
        });

        chart.on("click", (params) => {
          if (params.data?.raw) showCity(params.data.raw);
        });

        window.addEventListener("resize", () => chart.resize());
      }

      function dataForTab() {
        if (tab === "city") return atlas.cities.map((city) => ({ ...city, label: city.zh, sub: city.country }));
        if (tab === "school") return atlas.schools.map((item) => ({ ...item, label: item.name, sub: item.city }));
        return atlas.companies.map((item) => ({ ...item, label: item.name, sub: item.city }));
      }

      function renderList() {
        detail.classList.remove("show");
        list.style.display = "block";
        const rows = dataForTab();
        const max = Math.max(1, rows[0]?.count || 1);
        list.innerHTML = rows
          .slice(0, 80)
          .map((item, index) => {
            const width = Math.max(4, (item.count / max) * 100);
            const cityPayload = tab === "city" ? `data-city="${escapeHtml(item.zh)}"` : "";
            return `<div class="row" ${cityPayload}>
              <div class="rank">${String(index + 1).padStart(2, "0")}</div>
              <div class="name">
                <div class="primary">${escapeHtml(item.label)}</div>
                <div class="secondary">${escapeHtml(item.sub || "")}</div>
                <div class="bar" style="width:${width}%"></div>
              </div>
              <div class="count">${item.count}</div>
            </div>`;
          })
          .join("");
      }

      function orgRows(items) {
        if (!items.length) return '<div class="empty">暂无公开机构信息</div>';
        return items
          .map(([name, count]) => `<div class="org"><em>${escapeHtml(name)}</em><b>${count}</b></div>`)
          .join("");
      }

      function showCity(city) {
        list.style.display = "none";
        detail.classList.add("show");
        detail.innerHTML = `
          <button class="back" type="button">返回排行</button>
          <h2>${escapeHtml(city.zh)}</h2>
          <div class="meta">${escapeHtml(city.country)} · ${city.count} 位 Star 用户</div>
          <h3>高校与科研机构</h3>
          ${orgRows(city.schools)}
          <h3>企业与组织</h3>
          ${orgRows(city.companies)}
        `;
        detail.querySelector(".back").addEventListener("click", renderList);
      }

      function bindInteractions() {
        tabs.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-tab]");
          if (!button) return;
          tab = button.dataset.tab;
          tabs.querySelectorAll("button").forEach((item) => item.classList.toggle("active", item === button));
          renderList();
        });

        list.addEventListener("click", (event) => {
          const row = event.target.closest(".row[data-city]");
          if (!row) return;
          const city = atlas.cities.find((item) => item.zh === row.dataset.city);
          if (city) showCity(city);
        });

        worldView.addEventListener("click", () => setView("world"));
        chinaView.addEventListener("click", () => setView("china"));
      }

      function setView(mode) {
        worldView.classList.toggle("active", mode === "world");
        chinaView.classList.toggle("active", mode === "china");
        chart.setOption({
          geo: {
            center: mode === "china" ? [105, 33] : [38, 18],
            zoom: mode === "china" ? 4.7 : 1.04,
          },
        });
      }

      function boot() {
        if (!atlas) {
          mapEl.innerHTML = '<p class="error">未找到星图数据。</p>';
          return;
        }
        renderStats();
        renderFooter();
        renderMap();
        renderList();
        bindInteractions();
      }

      boot();
    </script>
  </body>
</html>
