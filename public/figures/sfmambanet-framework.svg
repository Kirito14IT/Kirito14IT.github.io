<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">SFMambaNet framework diagram</title>
  <desc id="desc">Input correspondences pass through pruning blocks, spectral-geometric feature extraction, spectral-global context aggregation, and verification.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#7aa7e8"/>
      <stop offset="1" stop-color="#234f9b"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" x2="1">
      <stop offset="0" stop-color="#ffe4c7"/>
      <stop offset="1" stop-color="#f7b47a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#e3f4d9"/>
      <stop offset="1" stop-color="#a8d38e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1f3b63" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#204b86"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="1164" height="594" rx="26" fill="#fffdfa" stroke="#111827" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="54" y="52" font-family="Georgia, serif" font-size="24" font-weight="700">Input Correspondences</text>
  <text x="970" y="52" font-family="Georgia, serif" font-size="24" font-weight="700">Output Correspondences</text>
  <rect x="62" y="84" width="130" height="82" rx="12" fill="#e7f3ff" stroke="#96b5de"/>
  <path d="M74 130 C96 88 142 168 178 104 M74 146 C102 92 144 172 180 128 M78 112 C110 154 148 90 184 150" stroke="#dc2626" stroke-width="4" fill="none"/>
  <path d="M76 126 C108 160 138 96 184 132" stroke="#16a34a" stroke-width="4" fill="none"/>
  <rect x="988" y="84" width="130" height="82" rx="12" fill="#e8fff0" stroke="#9bcaaa"/>
  <path d="M1000 124 C1032 160 1068 96 1110 132 M1002 144 C1030 102 1076 166 1112 110" stroke="#16a34a" stroke-width="4" fill="none"/>
  <path d="M1000 132 C1032 92 1078 164 1114 120" stroke="#22c55e" stroke-width="4" fill="none"/>
  <rect x="225" y="82" width="172" height="84" rx="12" fill="#fff7d9" stroke="#f5c84c" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="255" y="132" font-family="Georgia, serif" font-size="23">Pruning Block</text>
  <rect x="455" y="82" width="172" height="84" rx="12" fill="#fff7d9" stroke="#f5c84c" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="485" y="132" font-family="Georgia, serif" font-size="23">Pruning Block</text>
  <rect x="752" y="82" width="152" height="84" rx="12" fill="#fff0f4" stroke="#f29aaa" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="784" y="116" font-family="Georgia, serif" font-size="23">Verification</text>
  <text x="804" y="144" font-family="Georgia, serif" font-size="23">Block</text>
  <line x1="194" y1="124" x2="225" y2="124" stroke="#204b86" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="397" y1="124" x2="455" y2="124" stroke="#204b86" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="627" y1="124" x2="752" y2="124" stroke="#204b86" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="904" y1="124" x2="988" y2="124" stroke="#204b86" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="382" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#ef0000">Pruning</text>
  <text x="625" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#ef0000">Pruning</text>
  <rect x="28" y="232" width="566" height="322" rx="18" fill="#fffdf7" stroke="#f3c24a" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="110" y="264" font-family="Georgia, serif" font-size="22">Local Spectral-Geometric Feature Extractor</text>
  <rect x="606" y="232" width="270" height="322" rx="18" fill="#eef7ff" stroke="#f3c24a" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="642" y="264" font-family="Georgia, serif" font-size="22">Spectral-Global</text>
  <text x="650" y="292" font-family="Georgia, serif" font-size="22">Context Aggregator</text>
  <rect x="878" y="232" width="270" height="322" rx="18" fill="#fff1f4" stroke="#f29aaa" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="958" y="264" font-family="Georgia, serif" font-size="22">Verification Block</text>
  <g filter="url(#shadow)" font-family="Georgia, serif" font-size="18" text-anchor="middle">
    <rect x="58" y="312" width="28" height="190" rx="6" fill="url(#blue)"/>
    <rect x="118" y="314" width="72" height="186" rx="12" fill="url(#green)"/>
    <text transform="translate(158 438) rotate(-90)">Up projection</text>
    <rect x="238" y="314" width="72" height="186" rx="12" fill="url(#peach)"/>
    <text transform="translate(278 438) rotate(-90)">ResNet Block x 4</text>
    <rect x="355" y="314" width="72" height="186" rx="12" fill="url(#green)"/>
    <text transform="translate(395 438) rotate(-90)">KNN Graph Block</text>
    <rect x="470" y="314" width="72" height="186" rx="12" fill="url(#peach)"/>
    <text transform="translate(510 438) rotate(-90)">ResNet Block x 4</text>
    <rect x="538" y="314" width="54" height="186" rx="12" fill="#a9bddf" stroke="#315da8" stroke-width="4"/>
    <text transform="translate(570 438) rotate(-90)">LSGA Block x 1</text>
    <rect x="626" y="314" width="72" height="186" rx="12" fill="url(#peach)"/>
    <text transform="translate(666 438) rotate(-90)">ResNet Block x 4</text>
    <rect x="730" y="314" width="58" height="186" rx="12" fill="#a9bddf" stroke="#315da8" stroke-width="4"/>
    <text transform="translate(764 438) rotate(-90)">SIGM Block x 3</text>
    <rect x="805" y="314" width="72" height="186" rx="12" fill="url(#peach)"/>
    <text transform="translate(845 438) rotate(-90)">ResNet Block x 4</text>
    <rect x="936" y="314" width="88" height="186" rx="12" fill="url(#green)"/>
    <text transform="translate(984 462) rotate(-90)">Prediction and Full-Size Verification</text>
    <rect x="1080" y="314" width="26" height="186" rx="6" fill="url(#blue)"/>
    <text transform="translate(1128 455) rotate(-90)" font-size="20">Inlier probabilities: N x 1</text>
  </g>
  <g stroke="#111827" stroke-width="4" marker-end="url(#arrow)">
    <line x1="88" y1="407" x2="118" y2="407"/>
    <line x1="190" y1="407" x2="238" y2="407"/>
    <line x1="310" y1="407" x2="355" y2="407"/>
    <line x1="427" y1="407" x2="470" y2="407"/>
    <line x1="592" y1="407" x2="626" y2="407"/>
    <line x1="698" y1="407" x2="730" y2="407"/>
    <line x1="788" y1="407" x2="805" y2="407"/>
    <line x1="877" y1="407" x2="936" y2="407"/>
    <line x1="1024" y1="407" x2="1080" y2="407"/>
  </g>
</svg>
