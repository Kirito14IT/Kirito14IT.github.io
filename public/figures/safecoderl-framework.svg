<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1040" role="img" aria-labelledby="title desc">
  <title id="title">SafeCodeRL framework diagram</title>
  <desc id="desc">SafeCodeRL includes IoT/CPS task contexts, a five-agent closed loop, constraint-aware optimization, and a training pipeline.</desc>
  <defs>
    <linearGradient id="softGreen" x1="0" x2="1">
      <stop offset="0" stop-color="#f9fff0"/>
      <stop offset="1" stop-color="#e5f4dc"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e8f2ff"/>
    </linearGradient>
    <linearGradient id="softViolet" x1="0" x2="1">
      <stop offset="0" stop-color="#fff8ff"/>
      <stop offset="1" stop-color="#f2e8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#253b5b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#22324a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect x="15" y="15" width="1450" height="1010" rx="22" fill="#fffefa" stroke="#777" stroke-width="3" stroke-dasharray="10 10"/>
  <rect x="32" y="34" width="380" height="720" rx="28" fill="url(#softGreen)" stroke="#9aac89" stroke-width="2"/>
  <text x="118" y="70" font-family="Georgia, serif" font-size="30" font-weight="700">IoT/CPS Task Contexts</text>
  <rect x="55" y="82" width="335" height="122" rx="20" fill="#fbfff7" stroke="#6f8c57" stroke-width="3"/>
  <text x="112" y="120" font-family="Georgia, serif" font-size="22" font-weight="700">Requirement x = (r, e, b)</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="16" fill="#1f2937">
    <text x="118" y="164">Requirement</text>
    <text x="224" y="158">Execution</text>
    <text x="224" y="180">Context</text>
    <text x="325" y="158">Security</text>
    <text x="325" y="180">Boundary</text>
  </g>
  <g filter="url(#shadow)" font-family="Georgia, serif" font-size="18">
    <g transform="translate(54 238)">
      <rect width="336" height="88" rx="14" fill="#fbfff7" stroke="#9fb98a"/>
      <text x="90" y="52">Telemetry API</text><rect x="242" y="22" width="74" height="46" rx="8" fill="#ffe9ea" stroke="#d79aa0"/><text x="252" y="51" font-size="15">SQL Injection</text>
    </g>
    <g transform="translate(54 352)">
      <rect width="336" height="88" rx="14" fill="#fbfff7" stroke="#9fb98a"/>
      <text x="90" y="42">Gateway</text><text x="90" y="64">Diagnostics</text><rect x="242" y="22" width="74" height="46" rx="8" fill="#ffe9ea" stroke="#d79aa0"/><text x="250" y="51" font-size="15">Command Injection</text>
    </g>
    <g transform="translate(54 466)">
      <rect width="336" height="88" rx="14" fill="#fbfff7" stroke="#9fb98a"/>
      <text x="90" y="42">Config</text><text x="90" y="64">Handler</text><rect x="242" y="22" width="74" height="46" rx="8" fill="#ffe9ea" stroke="#d79aa0"/><text x="252" y="51" font-size="15">Path Traversal</text>
    </g>
    <g transform="translate(54 580)">
      <rect width="336" height="88" rx="14" fill="#fbfff7" stroke="#9fb98a"/>
      <text x="90" y="42">Data</text><text x="90" y="64">Aggregation</text><rect x="242" y="22" width="74" height="46" rx="8" fill="#ffe9ea" stroke="#d79aa0"/><text x="254" y="51" font-size="15">Unsafe Auth</text>
    </g>
  </g>
  <line x1="410" y1="392" x2="446" y2="392" stroke="#78a85f" stroke-width="8" marker-end="url(#arrow)"/>
  <rect x="438" y="34" width="580" height="720" rx="28" fill="url(#softBlue)" stroke="#88a9d4" stroke-width="2"/>
  <text x="608" y="70" font-family="Georgia, serif" font-size="30" font-weight="700">Five-Agent Closed Loop</text>
  <g filter="url(#shadow)" font-family="Georgia, serif" font-size="18" fill="#111827">
    <rect x="612" y="100" width="188" height="150" rx="22" fill="#f6fbff" stroke="#2d61a7" stroke-width="3"/>
    <circle cx="642" cy="128" r="16" fill="#1d5bb4"/><text x="637" y="135" fill="#fff" font-weight="700">1</text>
    <text x="675" y="132" font-weight="700">Planner Agent</text>
    <text x="665" y="212">Task DAG / JSON Plan</text>
    <rect x="794" y="280" width="190" height="150" rx="22" fill="#f8fff7" stroke="#4b8a3f" stroke-width="3"/>
    <circle cx="826" cy="308" r="16" fill="#4b8a3f"/><text x="821" y="315" fill="#fff" font-weight="700">2</text>
    <text x="858" y="312" font-weight="700">Code Agent</text>
    <text x="852" y="380">Generate / Edit</text><text x="870" y="404">AST Patch</text>
    <rect x="662" y="498" width="190" height="150" rx="22" fill="#fff9ef" stroke="#c29226" stroke-width="3"/>
    <circle cx="694" cy="526" r="16" fill="#c29226"/><text x="689" y="533" fill="#fff" font-weight="700">4</text>
    <text x="728" y="530" font-weight="700">Test Agent</text>
    <text x="722" y="598">Docker Sandbox</text>
    <rect x="858" y="480" width="190" height="150" rx="22" fill="#fbf7ff" stroke="#7a55b7" stroke-width="3"/>
    <circle cx="890" cy="508" r="16" fill="#7a55b7"/><text x="885" y="515" fill="#fff" font-weight="700">3</text>
    <text x="926" y="512" font-weight="700">Security Agent</text>
    <text x="922" y="580">Static + Rule Audit</text>
    <rect x="484" y="390" width="190" height="150" rx="22" fill="#f4ffff" stroke="#208b8b" stroke-width="3"/>
    <circle cx="516" cy="418" r="16" fill="#208b8b"/><text x="511" y="425" fill="#fff" font-weight="700">5</text>
    <text x="552" y="422" font-weight="700">Critic Agent</text>
    <text x="546" y="490">Reward / Routing</text><text x="572" y="514">Update</text>
  </g>
  <g stroke="#253b5b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M536 388 C538 260 588 190 612 166"/>
    <path d="M800 180 C858 200 900 238 910 280"/>
    <path d="M910 430 C906 452 894 466 878 480"/>
    <path d="M852 568 C820 620 770 650 734 648"/>
    <path d="M662 574 C590 570 538 540 526 540"/>
    <path d="M586 390 C640 330 720 330 792 344"/>
  </g>
  <text x="690" y="446" font-family="Georgia, serif" font-size="24" fill="#777">Iterative</text>
  <text x="676" y="474" font-family="Georgia, serif" font-size="24" fill="#777">Refinement</text>
  <rect x="1038" y="34" width="410" height="720" rx="28" fill="url(#softViolet)" stroke="#b794c9" stroke-width="2"/>
  <text x="1095" y="70" font-family="Georgia, serif" font-size="30" font-weight="700">Constraint-Aware Optimization</text>
  <g filter="url(#shadow)" font-family="Georgia, serif" font-size="18">
    <rect x="1062" y="92" width="360" height="218" rx="18" fill="#fffaff" stroke="#b794c9" stroke-width="2"/>
    <text x="1192" y="128" font-size="24" font-weight="700">Soft Constraint</text>
    <rect x="1100" y="152" width="86" height="46" rx="10" fill="#eff6ff" stroke="#6794d3" stroke-width="3"/><text x="1122" y="182">PPO</text>
    <rect x="1212" y="152" width="86" height="46" rx="10" fill="#fffbd7" stroke="#cabd4b" stroke-width="3"/><text x="1235" y="182">GAE</text>
    <rect x="1324" y="152" width="86" height="46" rx="10" fill="#fff4ff" stroke="#9c6cc6" stroke-width="3"/><text x="1346" y="182">Lagrange</text>
    <line x1="1186" y1="175" x2="1212" y2="175" stroke="#253b5b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1298" y1="175" x2="1324" y2="175" stroke="#253b5b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1126" y="225" width="238" height="46" rx="10" fill="#fff" stroke="#aaa"/>
    <text x="1154" y="255">max R_func  s.t. E[C_sec] <= delta</text>
    <rect x="1062" y="340" width="360" height="244" rx="18" fill="#fffaff" stroke="#b794c9" stroke-width="2"/>
    <text x="1190" y="376" font-size="24" font-weight="700">Hard Shield</text>
    <rect x="1100" y="426" width="90" height="72" rx="12" fill="#fff" stroke="#c2b28e"/><text x="1120" y="456">AST /</text><text x="1110" y="480">Code Action</text>
    <rect x="1225" y="424" width="92" height="76" rx="18" fill="#e8f1ff" stroke="#4779b6" stroke-width="3"/><text x="1245" y="468">Shield</text>
    <rect x="1335" y="398" width="74" height="124" rx="10" fill="#fff2f3" stroke="#dc8d96"/><text x="1350" y="425" font-size="14">os.system</text><text x="1352" y="452" font-size="14">shell=True</text><text x="1350" y="479" font-size="14">SQL concat</text><text x="1349" y="506" font-size="14">unsafe path</text>
    <line x1="1190" y1="462" x2="1225" y2="462" stroke="#253b5b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1317" y1="462" x2="1335" y2="462" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1062" y="612" width="360" height="112" rx="18" fill="#f1fff0" stroke="#9ac58a" stroke-width="2"/>
    <text x="1134" y="654" font-size="24" font-weight="700">Secure Output Artifact</text>
    <text x="1162" y="690">Tests Passed | High-Risk Vulns Down</text>
  </g>
  <rect x="30" y="780" width="1418" height="220" rx="24" fill="#fffaf1" stroke="#d3a772" stroke-width="2"/>
  <text x="650" y="818" font-family="Georgia, serif" font-size="30" font-weight="700">Training Pipeline</text>
  <g filter="url(#shadow)" font-family="Georgia, serif" font-size="18">
    <rect x="90" y="840" width="310" height="126" rx="20" fill="#f8fff2" stroke="#9ac58a" stroke-width="2"/>
    <circle cx="136" cy="876" r="18" fill="#70a45a"/><text x="131" y="883" fill="#fff" font-weight="700">1</text>
    <text x="168" y="880" font-weight="700">SFT Warm Start</text>
    <text x="226" y="922">HumanEval / APPS</text><text x="218" y="948">Functional Prior</text>
    <rect x="455" y="840" width="510" height="126" rx="20" fill="#f7fbff" stroke="#8fb0df" stroke-width="2"/>
    <circle cx="502" cy="876" r="18" fill="#4d77b8"/><text x="497" y="883" fill="#fff" font-weight="700">2</text>
    <text x="535" y="880" font-weight="700">Multi-Agent RL Rollout</text>
    <text x="574" y="936">Planner -> Code -> Security -> Test -> Critic -> Trajectory tau</text>
    <rect x="1030" y="840" width="350" height="126" rx="20" fill="#fbf7ff" stroke="#b794c9" stroke-width="2"/>
    <circle cx="1076" cy="876" r="18" fill="#7a55b7"/><text x="1071" y="883" fill="#fff" font-weight="700">3</text>
    <text x="1112" y="880" font-weight="700">Router Distillation</text>
    <text x="1138" y="924">Expert Paths</text><text x="1130" y="950">Efficient Inference</text>
  </g>
  <g stroke="#78a85f" stroke-width="5" marker-end="url(#arrow)">
    <line x1="402" y1="903" x2="455" y2="903"/>
    <line x1="966" y1="903" x2="1030" y2="903"/>
  </g>
</svg>
